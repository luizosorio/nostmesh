name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

env:
  GO_VERSION: "1.25"

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Verify formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt-formatted:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race -coverprofile=coverage.out ./...

      # go.sum only exists once there is a dependency, so it is checked
      # conditionally rather than assumed to be present.
      - name: Verify module tidiness
        run: |
          go mod tidy
          git diff --exit-code go.mod
          if [ -f go.sum ]; then git diff --exit-code go.sum; fi

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      # v8 of the action matches golangci-lint v2, which is the schema
      # .golangci.yml is written against. The v6 action installs the v1 line
      # and rejects that config outright.
      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.13.2

  portability:
    name: Portability guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      # The core must stay free of the operating system. Compiling for targets
      # that are out of scope proves the boundary holds before an adapter for
      # them is ever written.
      - name: Cross-compile
        run: |
          for target in linux/amd64 linux/arm64 windows/amd64 darwin/arm64; do
            os="${target%/*}"
            arch="${target#*/}"
            echo "building $os/$arch"
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" go build -o /dev/null ./...
          done

  licenses:
    name: License policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      # Strong copyleft propagates its terms to the combined work, which would
      # conflict with the project's goal of unrestricted commercial use.
      - name: Check dependency licenses
        run: |
          go install github.com/google/go-licenses@latest
          go-licenses check ./... \
            --disallowed_types=forbidden,restricted,reciprocal

      # THIRD-PARTY.md is the human-readable record of what we depend on and
      # under what terms. It has to name every direct dependency, or it is
      # documentation that quietly goes stale.
      - name: Verify THIRD-PARTY.md lists every dependency
        run: |
          missing=0
          # Modules that actually reach the binary, not everything in the module
          # graph: go.sum records transitive candidates that nothing imports.
          go list -deps ./... \
            | grep -E '^[a-z0-9-]+\.[a-z]+/' \
            | grep -v '^github.com/luizosorio/nostmesh' \
            | cut -d/ -f1-3 \
            | sort -u > /tmp/modules.txt
          while read -r module; do
            [ -n "$module" ] || continue
            if ! grep -qF "$module" THIRD-PARTY.md; then
              echo "::error::$module is a dependency but is not listed in THIRD-PARTY.md"
              missing=1
            fi
          done < /tmp/modules.txt

          if [ "$missing" -ne 0 ]; then
            echo "Update THIRD-PARTY.md so it records every dependency and its license."
            exit 1
          fi
          echo "THIRD-PARTY.md lists every dependency."


  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # .gitleaks.toml distinguishes private key material, which must never be
      # committed, from public keys, which are exchanged openly by design.
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml
