name: Release

# Tags only. A release is a deliberate act, and a workflow that also ran on a
# branch would publish artifacts nobody chose to publish.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

env:
  # The exact patch, matching CI. A release built with a different toolchain
  # than the one that tested the code is not the thing that was tested. See
  # NM-23.
  GO_VERSION: "1.25.14"

jobs:
  # The release is gated on the same checks a pull request faces. Publishing a
  # tag that would have failed CI is how a broken artifact reaches users with
  # nothing to say it was never verified.
  verify:
    name: Verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Format, vet, test and portability
        run: make check

      - uses: golangci/golangci-lint-action@4afd733a84b1f43292c63897423277bb7f4313a9 # v8.0.0
        with:
          version: v2.13.2

  build:
    name: Build artifacts
    runs-on: ubuntu-latest
    needs: verify
    steps:
      # Tags and full history: the version stamped into the binary comes from
      # `git describe`, and a shallow clone reports a version that is not the
      # tag being released.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: ${{ env.GO_VERSION }}

      # The tag as the workflow saw it, rather than what git describe infers.
      # They agree on a clean tagged checkout, and disagreeing is a state worth
      # failing on rather than publishing.
      - name: Confirm the tag matches the build version
        run: |
          tag="${GITHUB_REF_NAME}"
          described="$(git describe --tags --exact-match 2>/dev/null || true)"
          if [ "$tag" != "$described" ]; then
            echo "tag $tag does not match git describe ($described)" >&2
            exit 1
          fi

      # `make dist` rather than `make docker-dist`: the runner already has the
      # pinned toolchain from setup-go, so building inside a container here
      # would add a layer that changes nothing. Packaging still runs in nfpm's
      # image, pinned by digest.
      - name: Build archives and packages
        run: make dist

      - name: Show what will be published
        run: |
          ls -l dist/*.tar.gz dist/*.deb dist/*.rpm
          cat dist/SHA256SUMS

      # Verified here rather than trusted: a package that installs to the wrong
      # place, or omits the unit, is a defect users find and the pipeline could
      # have. See docs/releasing.md.
      - name: Check the packages contain what they should
        run: make dist-verify

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-artifacts
          path: |
            dist/*.tar.gz
            dist/*.deb
            dist/*.rpm
            dist/*_sbom.json
            dist/SHA256SUMS
          retention-days: 7

  publish:
    name: Publish release
    runs-on: ubuntu-latest
    needs: build
    permissions:
      # The only job that writes anything, and it writes exactly the release.
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-artifacts
          path: dist

      # Every file SHA256SUMS names has to be here, or `sha256sum -c` fails on a
      # complete download and trains the reader to ignore it. This catches the
      # shape rather than one instance: a new artifact added to the checksums
      # and forgotten in the upload lists above stops the release here.
      - name: Confirm every checksummed file is present
        run: |
          missing=0
          while read -r _ file; do
            [ -n "$file" ] || continue
            if [ ! -f "dist/$file" ]; then
              echo "::error::SHA256SUMS names $file, which is not being published"
              missing=1
            fi
          done < dist/SHA256SUMS
          [ "$missing" -eq 0 ] || exit 1
          echo "every checksummed file is present"

      - uses: softprops/action-gh-release@72f2c25fcb47643c292f7107632f7a47c1df5cd8 # v2.3.2
        with:
          files: |
            dist/*.tar.gz
            dist/*.deb
            dist/*.rpm
            dist/*_sbom.json
            dist/SHA256SUMS
          # A hyphen marks a pre-release, following SemVer: everything after it
          # is a pre-release identifier. So v0.2.4-2b is a step towards v0.2.4,
          # and v0.2.4 is the delivery — which is what the package versions
          # already say, since nfpm renders the same tag as 0.2.4~2b and "~"
          # orders before 0.2.4.
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
          fail_on_unmatched_files: true
